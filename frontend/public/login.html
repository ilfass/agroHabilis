<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgroHabilis - Login</title>
    <style>
      :root {
        --bg: #0b1220;
        --panel: #101a2f;
        --text: #e7edf8;
        --muted: #9db0d1;
        --accent: #3ad37c;
        --danger: #ff7d7d;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, Segoe UI, Arial, sans-serif;
        color: var(--text);
        background: radial-gradient(circle at 20% -10%, #1a2b4f, var(--bg) 45%);
      }
      .card {
        width: min(420px, 92vw);
        background: linear-gradient(180deg, var(--panel), #15223d);
        border: 1px solid #243659;
        border-radius: 14px;
        padding: 20px;
      }
      h1 { margin: 0 0 8px; font-size: 22px; }
      p { margin: 0 0 14px; color: var(--muted); }
      input, button {
        width: 100%;
        padding: 11px 12px;
        border-radius: 8px;
        border: 1px solid #3d5689;
        background: #0f1930;
        color: var(--text);
        margin-top: 8px;
      }
      button {
        border: none;
        background: linear-gradient(180deg, var(--accent), #1f7a3f);
        color: #07210f;
        font-weight: 700;
        cursor: pointer;
      }
      .error { color: var(--danger); min-height: 20px; margin-top: 8px; font-size: 13px; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Login admin</h1>
      <p>Ingresá la clave de administración para acceder al Control Center y Comandos.</p>
      <form id="loginForm">
        <input id="adminKey" type="password" placeholder="ADMIN_KEY" autocomplete="current-password" required />
        <button type="submit">Ingresar</button>
      </form>
      <div class="error" id="errorBox"></div>
    </div>
    <script>
      const $ = (id) => document.getElementById(id);
      const params = new URLSearchParams(window.location.search);
      const next = params.get("next") || "/dashboard/admin";

      async function checkSession() {
        const r = await fetch("/api/auth/admin/session");
        const d = await r.json();
        if (d.ok) window.location.href = next;
      }

      $("loginForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        $("errorBox").textContent = "";
        const adminKey = $("adminKey").value.trim();
        if (!adminKey) {
          $("errorBox").textContent = "Ingresá la clave.";
          return;
        }
        const r = await fetch("/api/auth/admin/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ adminKey }),
        });
        const d = await r.json();
        if (!d.ok) {
          $("errorBox").textContent = d.error || "No se pudo iniciar sesión.";
          return;
        }
        window.location.href = next;
      });

      checkSession();
    </script>
  </body>
  </html>
