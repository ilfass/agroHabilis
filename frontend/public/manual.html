<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manual de Usuario - AgroHabilis</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- GitHub Markdown CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown-light.min.css">
  
  <!-- Highlight.js for code blocks -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
  
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f8fafc;
      margin: 0;
      padding: 0;
      color: #0f172a;
    }
    
    header {
      background: linear-gradient(135deg, #0b1320 0%, #060a12 100%);
      color: white;
      padding: 20px 40px;
      display: flex;
      align-items: center;
      gap: 15px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    
    header img {
      height: 40px;
    }
    
    header h1 {
      margin: 0;
      font-family: 'Outfit', sans-serif;
      font-size: 24px;
      font-weight: 800;
    }
    
    .container {
      max-width: 1000px;
      margin: 40px auto;
      background: white;
      padding: 50px;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }
    
    .markdown-body {
      box-sizing: border-box;
      min-width: 200px;
      max-width: 900px;
      margin: 0 auto;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    
    .markdown-body h1, .markdown-body h2, .markdown-body h3 {
      font-family: 'Outfit', sans-serif;
      color: #0b1320;
    }

    .markdown-body h1 {
      color: #10b981;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 10px;
    }
    
    .markdown-body img {
      border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      max-width: 100%;
      height: auto;
      display: block;
      margin: 20px auto;
    }
    
    /* Mermaid charts */
    .mermaid {
      background: #f8fafc;
      padding: 20px;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      margin: 20px 0;
      border: 1px solid #e2e8f0;
    }
    
    .loading {
      text-align: center;
      padding: 100px;
      font-size: 18px;
      color: #64748b;
    }

    .loading-spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 4px solid #e2e8f0;
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <header>
    <img src="/favicon.png" alt="AgroHabilis Logo">
    <h1>Manual de Usuario</h1>
  </header>

  <div class="container">
    <div id="content" class="markdown-body">
      <div class="loading">
        <div class="loading-spinner"></div>
        <div>Cargando manual...</div>
      </div>
    </div>
  </div>

  <!-- Marked.js for parsing Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <!-- Highlight.js for code blocks syntax highlighting -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  
  <!-- Mermaid.js for diagrams -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>

  <script>
    // Initialize Mermaid
    mermaid.initialize({ 
      startOnLoad: false,
      theme: 'base',
      themeVariables: {
        primaryColor: '#ecfdf5',
        primaryTextColor: '#0f172a',
        primaryBorderColor: '#10b981',
        lineColor: '#64748b',
        secondaryColor: '#f1f5f9',
        tertiaryColor: '#ffffff'
      }
    });

    // Configure Marked
    marked.setOptions({
      highlight: function(code, lang) {
        if (lang === 'mermaid') {
          return `<div class="mermaid">${code}</div>`;
        }
        if (lang && hljs.getLanguage(lang)) {
          return hljs.highlight(code, { language: lang }).value;
        }
        return hljs.highlightAuto(code).value;
      },
      breaks: true,
      gfm: true
    });

    // Fetch and render Markdown
    async function loadManual() {
      try {
        const response = await fetch('/manual.md');
        if (!response.ok) throw new Error('No se pudo cargar el manual');
        
        const markdown = await response.text();
        
        // Parse markdown to HTML
        document.getElementById('content').innerHTML = marked.parse(markdown);
        
        // Render mermaid diagrams
        await mermaid.run({
          querySelector: '.mermaid'
        });
      } catch (error) {
        document.getElementById('content').innerHTML = `
          <div style="color: #ef4444; text-align: center; padding: 50px;">
            <h2>Error cargando el manual</h2>
            <p>${error.message}</p>
          </div>
        `;
      }
    }

    // Run when page loads
    window.addEventListener('DOMContentLoaded', loadManual);
  </script>
</body>
</html>
